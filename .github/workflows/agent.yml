name: AI Agent

# Comment "/agent <your request>" on an issue or pull request to run the agent.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  agent:
    # Only react to /agent comments from people you trust (owner, org members, collaborators).
    if: >-
      startsWith(github.event.comment.body, '/agent') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false   # keep the token out of .git/config

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent
        run: python -m agent.github_action
        env:
          # Add ANTHROPIC_API_KEY (Claude) or GEMINI_API_KEY (free) as a repository secret.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER }}   # optional: anthropic | gemini
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}         # optional: defaults per provider
